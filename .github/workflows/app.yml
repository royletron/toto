# An app release is a tag, app-v1.2.3. This checks the tag says what the app says and that the
# app at that commit is sound, then builds the Android app and puts it on EAS. (Xcode Cloud
# builds the iOS app from the same tag.) It makes no GitHub Release, on purpose: Totos update
# from the latest one. Run by hand, it builds whatever branch it is run on.
name: App release
on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The tag is the version
        if: github.event_name == 'push'
        run: test "app-v$(node -p "require('./app/app.json').expo.version")" = "$GITHUB_REF_NAME"
      - name: Check
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
          npx expo lint

  android:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EXPO_SECRET }}
    steps:
      # An Android build needs more room than a runner has spare: packaging fails, saying only that
      # it failed, when the disk fills. These are large and nothing here uses them.
      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build, and put it on EAS
        working-directory: app
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::No EXPO_TOKEN secret."; exit 1; }
          npm ci
          npx eas-cli@latest build --platform android --profile preview --local --non-interactive --output "$GITHUB_WORKSPACE/toto.apk"
          npx eas-cli@latest upload --platform android --build-path "$GITHUB_WORKSPACE/toto.apk" --non-interactive
      - uses: actions/upload-artifact@v4
        with:
          name: toto-android
          path: toto.apk
