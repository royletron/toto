# An app release is a tag, app-v1.2.3. This checks the tag says what the app says and that the
# app at that commit is sound, then builds the Android app, attaches it to a GitHub Release and
# puts it on EAS. (Xcode Cloud builds the iOS app from the same tag.) That release is marked a
# pre-release on purpose: Totos, the relay and the site all take releases/latest as the newest
# server, and GitHub never counts a pre-release as the latest. Run by hand, it builds whatever
# branch it is run on and releases nothing.
name: App release
on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The tag is the version
        if: github.event_name == 'push'
        run: test "app-v$(node -p "require('./app/app.json').expo.version")" = "$GITHUB_REF_NAME"
      - name: Check
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
          npx expo lint

  android:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EXPO_SECRET }}
    steps:
      # An Android build needs more room than a runner has spare: packaging fails, saying only that
      # it failed, when the disk fills. These are large and nothing here uses them.
      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        working-directory: app
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::No EXPO_TOKEN secret."; exit 1; }
          npm ci
          npx eas-cli@latest build --platform android --profile preview --local --non-interactive --output "$GITHUB_WORKSPACE/toto.apk"
      - name: Release it on GitHub
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" toto.apk --prerelease --latest=false --title "Toto app ${GITHUB_REF_NAME#app-v}" --notes "The Android app, to install directly. The iOS app is on TestFlight."
      # EAS limits how many builds are uploaded; the GitHub Release is the one that matters.
      - name: Put it on EAS
        working-directory: app
        run: npx eas-cli@latest upload --platform android --build-path "$GITHUB_WORKSPACE/toto.apk" --non-interactive || echo "::warning::The build was not uploaded to EAS."

      - uses: actions/upload-artifact@v4
        with:
          name: toto-android
          path: toto.apk
